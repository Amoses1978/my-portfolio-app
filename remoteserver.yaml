kind: pipeline
name: default

steps:
  - name: deploy
    image: appleboy/drone-ssh:1.8.2
    settings:
      host: your-server-ip.com
      username: ubuntu  # or ec2-user, root, etc.
      key: 
        from_secret: ssh_private_key
      script:
        - cd /path/to/your/app
        - chmod +x entrypoint.sh
        - ./entrypoint.sh